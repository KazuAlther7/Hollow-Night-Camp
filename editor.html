<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <title>Chapter Editor — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/mainbar.css">
  <link rel="stylesheet" href="css/editor.css">
</head>

<body class="camp-body editor-mode" data-page="editor">

  <main class="camp-app">
    <section class="camp-page editor-shell">
      <input id="chapterTitle" class="editor-title" type="text" placeholder="Chapter title" maxlength="120" aria-label="Chapter title">
      <textarea id="chapterBody" class="editor-paper" placeholder="Once upon a midnight in the hollow..." aria-label="Chapter text"></textarea>
      <div class="editor-status">
        <span id="wordCount">0 words</span>
        <span>Draft. Saving to Supabase comes next.</span>
      </div>
    </section>
  </main>

  <script type="module" src="js/editor.js"></script>

</body>
</html>
