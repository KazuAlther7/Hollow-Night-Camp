<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/image/favicon-192.png">
  <link rel="shortcut icon" href="assets/image/favicon.ico">
  <link rel="apple-touch-icon" href="assets/image/apple-touch-icon.png">
  <title>Chapter Editor — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/mainbar.css?v=8">
  <link rel="stylesheet" href="css/editor.css?v=7">
  <link rel="stylesheet" href="css/ui.css?v=4">
</head>

<body class="camp-body editor-mode" data-page="editor">

  <main class="camp-app">
    <section class="camp-page editor-shell">
      <div class="editor-topline">
        <a class="editor-back has-icon" id="backLink" href="novels.html"><span class="icon icon-back" aria-hidden="true"></span><span class="back-label">Back</span></a>
        <span class="editor-novel" id="editorNovel"></span>
      </div>

      <input id="chapterTitle" class="editor-title" type="text" placeholder="Chapter title" maxlength="160" aria-label="Chapter title">
      <input id="chapterSubtitle" class="editor-subtitle" type="text" placeholder="Subtitle (optional)" maxlength="160" aria-label="Chapter subtitle">

      <div class="editor-meta">
        <label>Chapter no.
          <input id="chapterNumber" type="number" min="0" step="1" inputmode="numeric">
        </label>
        <label>Volume / Arc
          <input id="chapterVolume" type="text" maxlength="80" placeholder="e.g. Volume 1 — The Gate">
        </label>
      </div>

      <div class="editor-cover">
        <span class="editor-cover-label">Chapter cover (optional)</span>
        <div class="hn-cover-row">
          <div class="hn-cover-preview" id="coverPreview" aria-hidden="true"></div>
          <label class="hn-btn ghost small" for="coverFile">Add / Replace</label>
          <input id="coverFile" class="hn-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <button class="hn-btn ghost small" id="removeCoverButton" type="button" hidden>Remove</button>
        </div>
        <p class="editor-cover-hint">Shown at the top of the chapter and on the homepage when this is the latest chapter. Without a cover, the novel cover is used on the homepage.</p>
      </div>

      <textarea id="chapterBody" class="editor-paper" placeholder="Once upon a midnight in the hollow..." aria-label="Chapter text"></textarea>

      <div class="editor-status">
        <span id="wordCount">0 words</span>
        <span id="saveState" role="status" aria-live="polite">Not saved yet.</span>
      </div>

      <div class="editor-actions">
        <button class="hn-btn ghost" id="saveDraftButton" type="button">Save Draft</button>
        <button class="hn-btn" id="publishButton" type="button">Publish</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/editor.js?v=7"></script>

</body>
</html>
