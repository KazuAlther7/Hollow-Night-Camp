<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/image/favicon-192.png">
  <link rel="shortcut icon" href="assets/image/favicon.ico">
  <link rel="apple-touch-icon" href="assets/image/apple-touch-icon.png">
  <title>Reading — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loader.css?v=2">
  <script src="js/loader.js?v=2"></script>
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/mainbar.css?v=10">
  <link rel="stylesheet" href="css/ui.css?v=4">
  <link rel="stylesheet" href="css/rating.css?v=1">
  <link rel="stylesheet" href="css/history.css?v=1">
</head>

<body class="camp-body" data-page="read">

  <main class="camp-app">
    <article class="camp-page reader-shell">
      <img class="reader-cover" id="readerCover" alt="" hidden>
      <p class="reader-novel" id="readerNovel"></p>
      <h1 id="readerTitle">Loading…</h1>
      <p class="reader-sub" id="readerSub" hidden></p>
      <div class="reader-tools" id="readerTools" hidden></div>
      <div class="reader-body" id="readerBody" aria-live="polite"></div>
      <section class="rating-card" id="readerRating" aria-label="Chapter rating" hidden></section>
      <nav class="reader-nav" id="readerNav" aria-label="Chapter navigation"></nav>
    </article>
  </main>

  <script type="module" src="js/read.js?v=10"></script>

</body>
</html>
