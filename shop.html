<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/image/favicon-192.png">
  <link rel="shortcut icon" href="assets/image/favicon.ico">
  <link rel="apple-touch-icon" href="assets/image/apple-touch-icon.png">
  <title>Shop — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loader.css?v=2">
  <script src="js/loader.js?v=2"></script>
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/mainbar.css?v=13">
  <link rel="stylesheet" href="css/shop.css?v=2">
</head>

<body class="camp-body" data-page="shop">

  <main class="camp-app">
    <section class="camp-page shop-page">
      <div class="shop-board">
        <h1 class="shop-sign">SHOP</h1>

        <div class="shop-panel shop-items" id="shopItems" tabindex="0" aria-label="Items for sale">
          <div class="shop-grid" id="shopGrid"></div>
        </div>

        <aside class="shop-side">
          <div class="shop-tabs" id="shopTabs" role="tablist" aria-label="Categories"></div>
          <div class="shop-panel shop-info" id="shopInfo" aria-live="polite">
            <div class="shop-info-art"><img id="infoArt" alt=""></div>
            <h2 class="shop-info-name" id="infoName">Pick an item</h2>
            <div class="shop-info-body">
              <span class="shop-info-cat" id="infoCat">—</span>
              <p class="shop-info-desc" id="infoDesc"></p>
              <button class="shop-buy" id="buyBtn" type="button" disabled>BUY</button>
              <p class="shop-msg" id="shopMsg"></p>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script type="module">
    import { initPage } from './js/shared.js?v=30';
    import { supabase } from './config/supabase.js';
    import { getCollectibles } from './js/collectibles.js';
    import { refreshWallet, setBalance, startLive, formatAmber } from './js/wallet.js';

    const COIN = 'assets/arcade/amber-coin.png';
    const A = 'assets/arcade/', B = 'assets/badges/';
    // Placeholder catalog — swap for a shop_items table later. price = Amber Coin.
    const FALLBACK = [
      { key: 'toy-d20',           cat: 'Toys',       name: 'Lucky D20',         price: 180, art: A + 'd20.png',           desc: 'A twenty-sided die. Rolls suspiciously well at night.' },
      { key: 'toy-sword',         cat: 'Toys',       name: 'Wooden Sword',      price: 200, art: A + 'sword.png',         desc: 'Whittled by a camper. Fights beasts, mostly imaginary ones.' },
      { key: 'toy-radio',         cat: 'Toys',       name: 'Walkie Talkie',     price: 280, art: A + 'radio.png',         desc: 'Static, whispers, and sometimes a voice that answers back.' },
      { key: 'keep-pinecone',     cat: 'Keepsakes',  name: 'Pinecone',          price: 90,  art: A + 'pine.png',          desc: 'Found near the old trail. It smells like rain.' },
      { key: 'keep-rune',         cat: 'Keepsakes',  name: 'Rune Stone',        price: 220, art: A + 'stone.png',         desc: 'Carved marks nobody at camp can read.' },
      { key: 'keep-binoculars',   cat: 'Keepsakes',  name: 'Binoculars',        price: 260, art: A + 'binocular.png',     desc: 'See what moves between the trees.' },
      { key: 'keep-eye',          cat: 'Keepsakes',  name: 'Watching Eye',      price: 400, art: A + 'eye.png',           desc: 'It blinks when you look away.' },
      { key: 'frame-autumnwood-wreath', cat: 'Outfit', rarity: 'uncommon', name: 'Autumnwood Wreath', price: 150, art: 'assets/frames/autumnwood-wreath.webp', desc: 'Twisted branches, fallen leaves and one warm lantern.' },
      { key: 'frame-emberbound-explorer', cat: 'Outfit', rarity: 'rare', name: 'Emberbound Explorer', price: 300, art: 'assets/frames/emberbound-explorer.webp', desc: 'A rope ring around a crackling campfire. Marshmallow included.' },
      { key: 'frame-clockwork-vanguard', cat: 'Outfit', rarity: 'epic', name: 'Clockwork Vanguard', price: 750, art: 'assets/frames/clockwork-vanguard.webp', desc: 'Riveted steel, a brass porthole and ticking gears.' },
      { key: 'frame-runestone-relic', cat: 'Outfit', rarity: 'rare', name: 'Runestone Relic', price: 350, art: 'assets/frames/runestone-relic.webp', desc: 'Moss-covered stones carved with runes nobody can read.' },
      { key: 'frame-golden-seal-of-kings', cat: 'Outfit', rarity: 'legendary', name: 'Golden Seal of Kings', price: 1000, art: 'assets/frames/golden-seal-of-kings.webp', desc: 'Amber gems set in gold, sealed with a lock fit for a king.' },
      { key: 'frame-astral-nightwatch', cat: 'Outfit', rarity: 'epic', name: 'Astral Nightwatch', price: 800, art: 'assets/frames/astral-nightwatch.webp', desc: 'Starlit feathers and glowing mushrooms keep watch over the night.' },
      { key: 'frame-mossbound-ruins', cat: 'Outfit', rarity: 'uncommon', name: 'Mossbound Ruins', price: 200, art: 'assets/frames/mossbound-ruins.webp', desc: 'Ancient ruins, slowly taken back by the vines.' },
      { key: 'frame-royal-embercrest', cat: 'Outfit', rarity: 'legendary', name: 'Royal Embercrest', price: 1200, art: 'assets/frames/royal-embercrest.webp', desc: 'A crest of polished amber for the camp\'s finest.' },
      { key: 'frame-mystic-hollowgrove', cat: 'Outfit', rarity: 'epic', name: 'Mystic Hollowgrove', price: 850, art: 'assets/frames/mystic-hollowgrove.webp', desc: 'A hollow tree ring lit by glowing mushrooms.' },
    ];
    let ITEMS = FALLBACK;
    const CATS = ['All', 'Outfit', 'Toys', 'Keepsakes'];
    const $ = (id) => document.getElementById(id);
    let cat = 'All', sel = null, balance = null, owned = new Set(), busy = false;

    const price = (n) => `<img src="${COIN}" alt="">${formatAmber(n)}`;
    const msg = (t, ok) => { $('shopMsg').textContent = t || ''; $('shopMsg').classList.toggle('is-ok', !!ok); };

    function renderTabs() {
      $('shopTabs').innerHTML = CATS.map((c) => `<button class="shop-tab${c === cat ? ' is-on' : ''}" role="tab" aria-selected="${c === cat}" data-cat="${c}" type="button">${c}</button>`).join('');
    }
    function renderGrid() {
      const list = ITEMS.filter((i) => cat === 'All' || i.cat === cat);
      $('shopGrid').innerHTML = list.length ? list.map((i, n) => `
        <button class="shop-card${i.key === sel?.key ? ' is-sel' : ''}${owned.has(i.key) ? ' is-owned' : ''}" style="--n:${n}" data-r="${i.rarity || ''}" data-key="${i.key}" type="button" aria-label="${i.name}">
          <span class="shop-art"><img src="${i.art}" alt="" loading="lazy" draggable="false"></span>
          <span class="shop-price">${owned.has(i.key) ? '✓ Owned' : price(i.price)}</span>
        </button>`).join('') : '<p class="shop-empty">Shelf is empty.</p>';
    }
    function renderInfo() {
      const i = sel;
      $('infoArt').src = i ? i.art : ''; $('infoArt').style.visibility = i ? 'visible' : 'hidden';
      $('infoName').textContent = i ? i.name : 'Pick an item';
      $('infoCat').textContent = i ? (i.cat === 'Outfit' ? 'Frame Skin' : i.cat) + (i.rarity ? ' · ' + i.rarity : '') : '—'; $('infoCat').dataset.r = i?.rarity || '';
      $('infoDesc').textContent = i ? i.desc : 'Tap something on the shelf to see what it does.';
      const b = $('buyBtn');
      if (!i) { b.disabled = true; b.textContent = 'BUY'; return; }
      if (owned.has(i.key)) { b.disabled = true; b.textContent = '✓ OWNED'; return; }
      b.disabled = busy || (balance !== null && balance < i.price);
      b.innerHTML = `BUY <img src="${COIN}" alt="">${formatAmber(i.price)}`;
    }
    const renderAll = () => { renderTabs(); renderGrid(); renderInfo(); };

    $('shopTabs').addEventListener('click', (e) => { const t = e.target.closest('[data-cat]'); if (!t) return; cat = t.dataset.cat; msg(''); renderTabs(); renderGrid(); $('shopItems').scrollTo({ top: 0, behavior: 'smooth' }); });
    $('shopGrid').addEventListener('click', (e) => { const c = e.target.closest('[data-key]'); if (!c) return; sel = ITEMS.find((i) => i.key === c.dataset.key); msg(''); renderGrid(); renderInfo(); });
    const ERR = { insufficient_balance: 'Not enough Amber.', already_owned: 'You already own this.', item_unavailable: 'Item is no longer sold.', not_signed_in: 'Sign in first.' };
    let confirming = null;
    const resetConfirm = () => { confirming = null; };
    $('buyBtn').addEventListener('click', async () => {
      if (!sel || busy || owned.has(sel.key)) return;
      if (confirming !== sel.key) {            // 1st click: ask to confirm
        confirming = sel.key; $('buyBtn').innerHTML = `CONFIRM? <img src="${COIN}" alt="">${formatAmber(sel.price)}`;
        msg('Tap again to buy.'); setTimeout(() => { if (confirming === sel?.key && !busy) { resetConfirm(); msg(''); renderInfo(); } }, 4000); return;
      }
      resetConfirm(); busy = true; renderInfo(); msg('');
      const { data, error } = await supabase.rpc('shop_buy', { p_item: sel.key });   // server checks price, balance, ownership
      busy = false;
      if (error) {
        const known = Object.keys(ERR).find((k) => error.message?.includes(k));
        console.warn(error); msg(known ? ERR[known] : 'Shop error: ' + (error.message || error.code || 'unknown')); if (known === 'already_owned') owned.add(sel.key); renderAll(); return;
      }
      if (data && typeof data.balance === 'number') { balance = data.balance; setBalance(balance); } else { const w = await refreshWallet(); balance = w?.balance ?? balance; }
      owned.add(sel.key); msg('Added to your Backpack!', true); renderAll();
    });
    $('shopGrid').addEventListener('click', resetConfirm);
    $('shopTabs').addEventListener('click', resetConfirm);

    await initPage({ active: 'shop' });
    renderAll();
    try {
      const { data } = await supabase.from('shop_items').select('key,title,description,category,asset_path,price,sort,rarity').order('sort');
      if (data?.length) { ITEMS = data.map((r) => ({ key: r.key, cat: r.category, name: r.title, price: r.price, art: r.asset_path, desc: r.description, rarity: r.category === 'Outfit' ? r.rarity : '' })); sel = null; renderAll(); }
    } catch (_) {}
    try { const w = await refreshWallet(); if (w) { balance = w.balance; startLive(); } } catch (_) {}
    document.addEventListener('amber:balance', (e) => { balance = e.detail.balance; renderInfo(); });
    try { (await getCollectibles()).forEach((c) => owned.add(c.key));
      const { data: pu } = await supabase.from('shop_purchases').select('item_key'); (pu || []).forEach((r) => owned.add(r.item_key)); } catch (_) {}
    renderAll();
  </script>

</body>
</html>
