<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/image/favicon-192.png">
  <link rel="shortcut icon" href="assets/image/favicon.ico">
  <link rel="apple-touch-icon" href="assets/image/apple-touch-icon.png">
  <title>Novel — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/mainbar.css?v=9">
  <link rel="stylesheet" href="css/novels.css?v=5">
  <link rel="stylesheet" href="css/ui.css?v=4">
  <link rel="stylesheet" href="css/rating.css?v=1">
  <link rel="stylesheet" href="css/volumes.css?v=1">
  <link rel="stylesheet" href="css/history.css?v=1">
</head>

<body class="camp-body" data-page="novel">

  <main class="camp-app">
    <section class="camp-page novel-detail">
      <div class="novel-cover" id="novelCover" aria-hidden="true"></div>
      <div>
        <p class="novel-back"><a class="has-icon" href="novels.html"><span class="icon icon-back" aria-hidden="true"></span>All novels</a></p>
        <h1 id="novelTitle">Novel</h1>
        <p id="novelMeta">Loading…</p>
        <p class="novel-facts" id="novelFacts"></p>
        <div class="novel-rating" id="novelRating" hidden></div>
        <p class="novel-tagline" id="novelTagline" hidden></p>
        <p class="novel-synopsis" id="novelSynopsis"></p>

        <div class="novel-actions" id="novelActions" hidden>
          <a class="hn-btn" id="newChapterLink" href="editor.html"><span class="icon icon-add-novel" aria-hidden="true"></span>New Chapter</a>
          <button class="hn-btn ghost" id="importButton" type="button">Import Chapter</button>
          <button class="hn-btn ghost" id="novelSettingsButton" type="button">Novel Settings</button>
        </div>

        <div class="novel-continue" id="novelContinue" hidden></div>

        <h2 class="chapter-heading">Chapters</h2>
        <ul class="chapter-list" id="chapterList" aria-live="polite">
          <li>Loading…</li>
        </ul>
      </div>
    </section>
  </main>

  <script type="module" src="js/novels.js?v=12"></script>

</body>
</html>
