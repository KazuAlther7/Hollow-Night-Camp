<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <title>Novels — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/mainbar.css?v=6">
  <link rel="stylesheet" href="css/novels.css?v=4">
</head>

<body class="camp-body" data-page="novels">

  <main class="camp-app">
    <section class="camp-page">
      <div class="library-head">
        <h1>Novels &amp; Stories</h1>
        <p>The camp library. Every shelf starts empty until someone brings a story.</p>
      </div>

      <p class="author-hint" id="authorHint" hidden>
        <i class="icon icon-author-studio" aria-hidden="true"></i> You are an Author. Creating novels from this page is coming next.
      </p>

      <div class="novel-grid" id="novelGrid"></div>

      <div class="empty-shelf" id="emptyShelf">
        <strong>No stories yet.</strong>
        The woods are quiet. Check back soon.
      </div>
    </section>
  </main>

  <script type="module" src="js/novels.js?v=4"></script>

</body>
</html>
