<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251d">
  <title>Settings — Hollow Night Camp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/mainbar.css">
</head>

<body class="camp-body" data-page="settings">

  <main class="camp-app">
    <section class="camp-page camp-placeholder-page">
      <h1>Settings</h1>
      <p>Your preferences and camp settings will live here.</p>
      <p style="margin-top:28px"><button id="signOutButton" class="home-logout-button" type="button" style="margin:0">Sign out of camp</button></p>
    </section>
  </main>

  <script type="module">
    import { initPage, signOut } from './js/shared.js';
    await initPage({ active: 'settings' });
    const btn = document.getElementById('signOutButton');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'HEADING OUT...';
      try { await signOut(); } catch (e) { btn.disabled = false; btn.textContent = 'Sign out of camp'; }
    });
  </script>

</body>
</html>
